<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#a8683f">
  <meta name="description" content="Tus tareas pendientes ordenadas por vencimiento: hoy, semana, mes, listas de compras y avisos.">
  <title>Tudu</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-main">
        <p class="day" id="topDay">—</p>
        <h1 id="topTitle">Hoy</h1>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="searchBtn" title="Buscar" aria-label="Buscar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <button class="icon-btn" id="notifBtn" title="Activar avisos" aria-label="Activar avisos">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
      </div>
    </header>

    <!-- Search bar -->
    <div class="searchbar" id="searchbar" hidden>
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar tareas o #etiqueta…" autocomplete="off">
      <button id="searchClear" aria-label="Cerrar búsqueda">&times;</button>
    </div>

    <div class="progress-wrap" id="progressWrap">
      <div class="bar"><i id="progressFill" style="width:0%"></i></div>
      <span class="pct" id="progressPct">0/0</span>
    </div>

    <!-- Single navigation (chips con contador) -->
    <nav class="navc" role="tablist" aria-label="Vistas">
      <button class="navc-btn on" data-view="hoy" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L20 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>Hoy</span><span class="cnt" id="cntHoy" hidden></span>
      </button>
      <button class="navc-btn" data-view="semana" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
        <span>Semana</span><span class="cnt" id="cntSemana" hidden></span>
      </button>
      <button class="navc-btn" data-view="mes" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
        <span>Mes</span>
      </button>
      <button class="navc-btn" data-view="compras" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 3h3l2.4 12.6a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L21 7H6"/></svg>
        <span>Compras</span><span class="cnt" id="cntCompras" hidden></span>
      </button>
    </nav>

    <!-- Content -->
    <main class="content" id="content"></main>

    <!-- FAB -->
    <button class="fab" id="fab" aria-label="Agregar">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <!-- Task / list editor sheet -->
  <div class="sheet-overlay" id="sheetOverlay" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-grip"></div>
      <h2 id="sheetTitle">Nueva tarea</h2>
      <form id="taskForm">
        <label class="field">
          <span>¿Qué tenés que hacer?</span>
          <input type="text" id="fTitle" placeholder="Ej: mañana 15:00 pedir turno #salud" autocomplete="off" required>
          <small class="hint" id="parseHint"></small>
        </label>

        <div class="task-only">
          <div class="field">
            <span>Prioridad</span>
            <div class="prio-select" id="prioChips">
              <button type="button" class="pchip p3" data-p="3">Alta</button>
              <button type="button" class="pchip p2" data-p="2">Media</button>
              <button type="button" class="pchip p1" data-p="1">Baja</button>
              <button type="button" class="pchip on p0" data-p="0">Ninguna</button>
            </div>
          </div>

          <div class="field-row">
            <label class="field"><span>Fecha límite</span><input type="date" id="fDate"></label>
            <label class="field"><span>Hora</span><input type="time" id="fTime"></label>
          </div>

          <div class="field">
            <span>Categoría</span>
            <div class="chips-select" id="catChips">
              <button type="button" class="cchip on" data-cat="General">General</button>
              <button type="button" class="cchip" data-cat="Salud">Salud</button>
              <button type="button" class="cchip" data-cat="Trabajo">Trabajo</button>
              <button type="button" class="cchip" data-cat="Trámites">Trámites</button>
              <button type="button" class="cchip" data-cat="Casa">Casa</button>
            </div>
          </div>

          <label class="field">
            <span>Etiquetas <small>(separadas por espacio)</small></span>
            <input type="text" id="fTags" placeholder="#salud #urgente" autocomplete="off">
          </label>

          <div class="field">
            <span>Subtareas</span>
            <div class="subs-editor" id="subsEditor"></div>
            <div class="sub-add">
              <input type="text" id="subInput" placeholder="Agregar paso…" autocomplete="off">
              <button type="button" id="subAddBtn" aria-label="Agregar paso">+</button>
            </div>
          </div>

          <label class="field">
            <span>Avisarme antes</span>
            <select id="fRemind">
              <option value="0">A la hora exacta</option>
              <option value="30">30 minutos antes</option>
              <option value="60" selected>1 hora antes</option>
              <option value="180">3 horas antes</option>
              <option value="1440">1 día antes</option>
            </select>
          </label>
        </div>

        <div class="sheet-actions">
          <button type="button" class="btn danger-icon" id="sheetDelete" hidden aria-label="Eliminar tarea">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
          </button>
          <button type="button" class="btn ghost" id="sheetCancel">Cancelar</button>
          <button type="submit" class="btn primary" id="sheetSave">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
