<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2f7a6f">
  <meta name="description" content="Tus tareas pendientes ordenadas por vencimiento. Semana, mes, listas de compras y avisos.">
  <title>Pendientes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-main">
        <p class="day" id="topDay">—</p>
        <h1 id="topTitle">Esta semana</h1>
      </div>
      <button class="icon-btn" id="notifBtn" title="Activar avisos" aria-label="Activar avisos">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
    </header>

    <div class="progress-wrap" id="progressWrap">
      <div class="bar"><i id="progressFill" style="width:0%"></i></div>
      <span class="pct" id="progressPct">0/0</span>
    </div>

    <!-- Tabs -->
    <nav class="tabs" role="tablist">
      <button class="tab on" data-view="semana" role="tab">Semana</button>
      <button class="tab" data-view="mes" role="tab">Mes</button>
      <button class="tab" data-view="compras" role="tab">Compras</button>
    </nav>

    <!-- Content -->
    <main class="content" id="content"></main>

    <!-- FAB -->
    <button class="fab" id="fab" aria-label="Agregar">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <!-- Bottom nav -->
    <nav class="navbar">
      <button class="nav-item on" data-view="semana">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>Tareas</span>
      </button>
      <button class="nav-item" data-view="mes">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span>Mes</span>
      </button>
      <button class="nav-item" data-view="compras">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
        <span>Compras</span>
      </button>
    </nav>
  </div>

  <!-- Install banner -->
  <div class="install-banner" id="installBanner" hidden>
    <div class="ib-logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <div class="ib-txt"><b>Instalar Pendientes</b><span>Agregala a tu pantalla de inicio</span></div>
    <button class="ib-btn" id="installBtn">Instalar</button>
    <button class="ib-close" id="installClose" aria-label="Cerrar">&times;</button>
  </div>

  <!-- Task / item editor sheet -->
  <div class="sheet-overlay" id="sheetOverlay" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-grip"></div>
      <h2 id="sheetTitle">Nueva tarea</h2>
      <form id="taskForm">
        <label class="field">
          <span>¿Qué tenés que hacer?</span>
          <input type="text" id="fTitle" placeholder="Ej: Pedir turno médico" autocomplete="off" required>
        </label>
        <div class="field-row" id="taskFields">
          <label class="field">
            <span>Fecha límite</span>
            <input type="date" id="fDate">
          </label>
          <label class="field">
            <span>Hora</span>
            <input type="time" id="fTime">
          </label>
        </div>
        <label class="field" id="catField">
          <span>Categoría</span>
          <div class="chips-select" id="catChips">
            <button type="button" class="cchip on" data-cat="General">General</button>
            <button type="button" class="cchip" data-cat="Salud">Salud</button>
            <button type="button" class="cchip" data-cat="Trabajo">Trabajo</button>
            <button type="button" class="cchip" data-cat="Trámites">Trámites</button>
            <button type="button" class="cchip" data-cat="Casa">Casa</button>
          </div>
        </label>
        <label class="field" id="remindField">
          <span>Avisarme antes</span>
          <select id="fRemind">
            <option value="0">A la hora exacta</option>
            <option value="30">30 minutos antes</option>
            <option value="60" selected>1 hora antes</option>
            <option value="180">3 horas antes</option>
            <option value="1440">1 día antes</option>
          </select>
        </label>
        <div class="sheet-actions">
          <button type="button" class="btn ghost" id="sheetCancel">Cancelar</button>
          <button type="submit" class="btn primary" id="sheetSave">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
