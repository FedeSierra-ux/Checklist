name: Compilar APK firmado (release)

# Genera un APK de release FIRMADO y lo publica como GitHub Release,
# con el APK adjunto para descargar directo (pestaña "Releases").
#
# Firma:
#  - Si cargás los secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS y
#    KEY_PASSWORD, usa TU clave estable (podés actualizar la app sin desinstalar
#    entre versiones).
#  - Si no hay secrets, genera una clave automática para esta corrida (el APK
#    igual queda firmado e instalable; para actualizar tendrás que reinstalar).

on:
  workflow_dispatch:
  push:
    branches: ["Main", "main", "master"]
    tags: ["v*"]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "icons/**"
      - "assets/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/build-apk-release.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar web y sincronizar Capacitor
        run: |
          npm run copy:web
          npx cap sync android

      - name: Preparar keystore de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Usando keystore de los secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "Sin secrets: genero una keystore automática para esta corrida."
            PW="pendientes$(date +%s)"
            keytool -genkeypair -v -keystore "$KS" -alias pendientes \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PW" -keypass "$PW" \
              -dname "CN=Pendientes, OU=App, O=Pendientes, L=, S=, C=AR"
            echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=pendientes" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Compilar APK (release firmado)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Preparar nombre de versión
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/pendientes.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: pendientes-apk-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publicar GitHub Release con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Pendientes ${{ steps.ver.outputs.tag }}"
          body: |
            APK de Android instalable, generado automáticamente desde `${{ github.ref_name }}`.

            Descargá **pendientes.apk** de abajo, pasalo al teléfono e instalalo
            (activá antes "Instalar apps de orígenes desconocidos").
          files: android/app/build/outputs/apk/release/pendientes.apk
          make_latest: true
