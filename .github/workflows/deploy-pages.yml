name: Publicar PWA (GitHub Pages)

# Publica la app web en GitHub Pages: https://<usuario>.github.io/<repo>/
# Sube solo los archivos de la app (armados en www/), no el proyecto Android.

on:
  push:
    branches: ["main", "master"]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "icons/**"
      - "assets/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "scripts/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Armar www/ desde la raíz
        run: node scripts/copy-web.mjs

      # Requiere activar Pages una vez: Settings -> Pages -> Source: "GitHub Actions".
      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
