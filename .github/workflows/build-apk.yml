name: Compilar APK

# Genera el APK de Android con Capacitor y lo deja como artefacto descargable.
# Se puede correr a mano (Actions -> Compilar APK -> Run workflow) o en cada push.

on:
  push:
    branches: ["**"]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "icons/**"
      - "assets/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        # El SDK nuevo del runner ya no trae el paquete "tools" que la acción
        # instala por defecto (falla con "Failed to find package 'tools'").
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar web y sincronizar Capacitor
        run: |
          npm run copy:web
          npx cap sync android

      - name: Compilar APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tudu-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
